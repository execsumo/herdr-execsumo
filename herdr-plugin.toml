id = "herdr-space-aware-agents"
name = "Space-Aware Agents"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Filter the Agents list to the selected space and nest subagents under the orchestrator that spawned them"
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["python3", "main.py", "--startup"]

[[events]]
on = "workspace.focused"
command = ["python3", "main.py", "--event"]

[[events]]
on = "workspace.created"
command = ["python3", "main.py", "--event"]

[[events]]
on = "workspace.closed"
command = ["python3", "main.py", "--event"]

[[events]]
on = "workspace.renamed"
command = ["python3", "main.py", "--event"]

[[events]]
on = "pane.closed"
command = ["python3", "main.py", "--event"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "main.py", "--event"]

[[events]]
on = "pane.moved"
command = ["python3", "main.py", "--event"]

[[events]]
on = "tab.moved"
command = ["python3", "main.py", "--event"]

[[actions]]
id = "toggle"
title = "Toggle space-aware agent filtering"
contexts = ["workspace", "global"]
command = ["python3", "main.py", "--action", "toggle"]

[[actions]]
id = "enable"
title = "Enable space-aware agent filtering"
contexts = ["workspace", "global"]
command = ["python3", "main.py", "--action", "enable"]

[[actions]]
id = "disable"
title = "Disable space-aware agent filtering"
contexts = ["workspace", "global"]
command = ["python3", "main.py", "--action", "disable"]

[[actions]]
id = "status"
title = "Show space-aware agent filtering status"
contexts = ["workspace", "global"]
command = ["python3", "main.py", "--action", "status"]

[[actions]]
id = "collapse"
title = "Collapse or expand the focused agent's subagents"
contexts = ["workspace", "global"]
command = ["python3", "main.py", "--action", "collapse"]

[[actions]]
id = "subagents"
title = "Hide or show all subagents"
contexts = ["workspace", "global"]
command = ["python3", "main.py", "--action", "subagents"]

[[actions]]
id = "refresh"
title = "Recompute the agent tree"
contexts = ["workspace", "global"]
command = ["python3", "main.py", "--action", "refresh"]

[[panes]]
id = "status"
title = "Space-Aware Agents"
placement = "popup"
width = 64
height = 18
command = ["python3", "main.py", "--pane"]
